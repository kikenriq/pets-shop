# Netlify configuration. Inert if the project is deployed to Vercel instead,
# so it is safe to keep either way.
#
# The existing Pet's Shop site on Netlify was built from the old Vite project,
# so its build settings still point at `dist/`. Declaring them here overrides
# that, and naming the plugin explicitly matters for an existing site — the
# Next.js Runtime is only auto-installed for newly created ones.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"

# Build-time fingerprinted assets never change under the same URL.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    cache-control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
